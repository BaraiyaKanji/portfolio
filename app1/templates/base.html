<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kanji Baraiya is a Python and Django developer based in Gujarat, India, with experience in PHP, frontend development, and web app projects.">
    <meta name="theme-color" content="#07111f">
    <title>{% block title %}Kanji Baraiya | Python & Django Developer{% endblock %}</title>

    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'app1/css/style.css' %}?v=2">
</head>

<body id="top" class="bg-dark page-shell">

    {% include 'components/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'components/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.documentElement.classList.add('js-motion');

        const revealItems = document.querySelectorAll('[data-aos]');
        if ('IntersectionObserver' in window) {
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12 });

            revealItems.forEach((item) => revealObserver.observe(item));
        } else {
            revealItems.forEach((item) => item.classList.add('is-visible'));
        }

        const sectionLinks = document.querySelectorAll('[data-section-link]');
        const observedSections = document.querySelectorAll('#home, #about, #skills, #projects, #contact');
        if ('IntersectionObserver' in window && sectionLinks.length && observedSections.length) {
            const sectionObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    sectionLinks.forEach((link) => {
                        const isCurrent = link.hash === `#${entry.target.id}`;
                        link.classList.toggle('active', isCurrent);
                        if (isCurrent) {
                            link.setAttribute('aria-current', 'location');
                        } else {
                            link.removeAttribute('aria-current');
                        }
                    });
                });
            }, { rootMargin: '-25% 0px -65% 0px' });

            observedSections.forEach((section) => sectionObserver.observe(section));
        }

        document.querySelectorAll('.navbar-nav [data-section-link]').forEach((link) => {
            link.addEventListener('click', () => {
                const menu = document.querySelector('#navbarNav');
                if (menu && menu.classList.contains('show')) {
                    bootstrap.Collapse.getOrCreateInstance(menu).hide();
                }
            });
        });
    </script>

</body>
</html>
